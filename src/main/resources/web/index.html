<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Console Chess</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #172033;
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(94vw, 620px); padding: 1.25rem 0; text-align: center; }
    h1 { margin: 0 0 .25rem; }
    #status { min-height: 1.5em; margin: .5rem 0 1rem; font-weight: 600; }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: min(88vw, 560px);
      aspect-ratio: 1;
      margin: 0 auto;
      border: 5px solid #263449;
      border-radius: 4px;
      overflow: hidden;
      box-sizing: border-box;
    }
    .square {
      position: relative;
      display: grid;
      place-items: center;
      border: 0;
      padding: 0;
      font-size: clamp(1.7rem, 8vw, 3.8rem);
      cursor: pointer;
    }
    .light { background: #e8d5b5; }
    .dark { background: #77916d; }
    .square.selected { box-shadow: inset 0 0 0 5px #f4c542; }
    .square.target::after {
      content: "";
      position: absolute;
      width: 22%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #24364b88;
    }
    .piece { position: relative; z-index: 1; line-height: 1; }
    .white-piece { color: #fff; text-shadow: 0 1px 3px #111, 1px 0 #111, -1px 0 #111; }
    .black-piece { color: #172033; text-shadow: 0 1px 1px #fff8; }
    .controls { display: flex; justify-content: center; gap: .75rem; margin-top: 1rem; }
    button.control { border: 0; border-radius: 6px; padding: .65rem 1rem; background: #263449; color: white; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #e6a700; outline-offset: 2px; }
    .hint { color: #566174; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Console Chess</h1>
    <div id="status" role="status" aria-live="polite">Loading game…</div>
    <div id="board" aria-label="Chess board"></div>
    <div class="controls">
      <button class="control" id="undo">Undo</button>
      <button class="control" id="new-game">New game</button>
    </div>
    <p class="hint">Click a piece, then a highlighted square. This board is shared by everyone visiting this page.</p>
  </main>
  <script>
    const boardElement = document.querySelector("#board");
    const statusElement = document.querySelector("#status");
    const symbols = {
      K: "♔", Q: "♕", R: "♖", B: "♗", N: "♘", P: "♙",
      k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟"
    };
    let game;
    let selected = null;

    async function refresh() {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error("Could not load the game.");
      game = await response.json();
      render();
    }

    function render() {
      boardElement.replaceChildren();
      for (let rank = 7; rank >= 0; rank--) {
        for (let file = 0; file < 8; file++) {
          const index = rank * 8 + file;
          const square = document.createElement("button");
          square.type = "button";
          square.className = `square ${(rank + file) % 2 === 0 ? "light" : "dark"}`;
          square.setAttribute("aria-label", `${String.fromCharCode(97 + file)}${rank + 1}`);
          const moveTargets = selected === null ? [] : game.legalMoves.filter(move => move.from === selected);
          if (selected === index) square.classList.add("selected");
          if (moveTargets.some(move => move.to === square.getAttribute("aria-label"))) square.classList.add("target");

          const piece = game.board[index];
          if (piece !== ".") {
            const span = document.createElement("span");
            span.className = `piece ${piece === piece.toUpperCase() ? "white-piece" : "black-piece"}`;
            span.textContent = symbols[piece];
            square.append(span);
          }
          square.addEventListener("click", () => selectSquare(index));
          boardElement.append(square);
        }
      }

      const turn = game.turn === "WHITE" ? "White" : "Black";
      statusElement.textContent = game.finished
        ? game.result
        : `${turn} to move${game.inCheck ? " — check!" : ""}`;
    }

    async function selectSquare(index) {
      if (!game || game.finished) return;
      if (selected === null) {
        const piece = game.board[index];
        const isCurrentPlayerPiece = piece !== "." &&
          (game.turn === "WHITE" ? piece === piece.toUpperCase() : piece === piece.toLowerCase());
        if (isCurrentPlayerPiece && game.legalMoves.some(move => move.from === squareName(index))) {
          selected = index;
          render();
        }
        return;
      }

      const from = squareName(selected);
      const to = squareName(index);
      const options = game.legalMoves.filter(move => move.from === from && move.to === to);
      if (options.length > 0) {
        let promotion = "";
        if (options.some(move => move.promotion)) {
          promotion = (prompt("Promote to Q, R, B, or N", "Q") || "Q").toUpperCase();
          if (!["Q", "R", "B", "N"].includes(promotion)) {
            selected = null;
            render();
            return;
          }
        }
        selected = null;
        await post("/api/move", { from, to, promotion });
        return;
      }

      const piece = game.board[index];
      const isCurrentPlayerPiece = piece !== "." &&
        (game.turn === "WHITE" ? piece === piece.toUpperCase() : piece === piece.toLowerCase());
      selected = isCurrentPlayerPiece ? index : null;
      render();
    }

    function squareName(index) {
      return String.fromCharCode(97 + index % 8) + (Math.floor(index / 8) + 1);
    }

    async function post(path, fields = {}) {
      try {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(fields)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Request failed.");
        game = result;
        selected = null;
        render();
      } catch (error) {
        statusElement.textContent = error.message;
      }
    }

    document.querySelector("#undo").addEventListener("click", () => post("/api/undo"));
    document.querySelector("#new-game").addEventListener("click", () => post("/api/new"));
    refresh().catch(error => { statusElement.textContent = error.message; });
    window.setInterval(() => refresh().catch(() => {}), 2500);
  </script>
</body>
</html>
